name: Dotfiles CI

# Least privilege for every job below: they only check out the repo and run
# linters — none comment on PRs, push, or touch releases. Declared at workflow
# level rather than per-job so a future job cannot silently inherit write scope.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Without it there is no way to exercise this workflow against
  # an unchanged tree — which mattered on 2026-07-29, when Actions had been off
  # at the org level and no run existed for any recent commit to re-run.
  workflow_dispatch:

jobs:
  shell-regressions:
    name: Shell regression fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh stow
      - name: Check Zsh syntax
        run: zsh -n zsh/.zshrc && zsh -n zsh/.zprofile
      - name: Run isolated regression fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  formatting-regressions:
    name: Project formatting policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.5
      - name: Prepare pinned test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/format-tools" prettier@3.6.2 @biomejs/biome@2.2.7
          echo "$RUNNER_TEMP/format-tools/node_modules/.bin" >> "$GITHUB_PATH"
          pin=$(python3 -c 'import json; print(json.load(open("nvim/.config/nvim/lazy-lock.json"))["conform.nvim"]["commit"])')
          git init "$RUNNER_TEMP/conform"
          git -C "$RUNNER_TEMP/conform" remote add origin https://github.com/stevearc/conform.nvim.git
          git -C "$RUNNER_TEMP/conform" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/conform" checkout --detach FETCH_HEAD
          echo "DOTFILES_TEST_CONFORM_DIR=$RUNNER_TEMP/conform" >> "$GITHUB_ENV"
      - name: Run minimal editor fixtures
        run: python3 tests/run_formatting.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # severity: warning. At the action's default (every severity) this job
      # gated on style notes and could never pass — it failed on EVERY run on
      # main from 2026-05-27 to 2026-06-10, which is how the repo ended up with a
      # permanently-red gate nobody read. It was first pinned to `error`, then
      # tightened to `warning` here once the 31-warning backlog was actually
      # cleared rather than suppressed.
      #
      # 65 note-level findings remain — 44 × SC2086 (27 in sketchybar items and
      # plugins where the word-splitting is deliberate, 12 in the vendored
      # fzf-git.sh), the rest SC2059/SC2001/SC2015/SC2016/SC2012. Counted
      # 2026-08-22 with shellcheck 0.11.0 over the 121 files the action
      # discovers; the action pulls `stable`, so the figure drifts with the
      # toolchain — re-measure before budgeting against it instead of trusting
      # the number here (the 52 it replaced was stale by 13). Do NOT drop to the
      # default severity to pick these up unless they are fixed first — that is
      # exactly how this gate died the first time.
      - name: Run ShellCheck on custom scripts
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091 -e SC2034 -e SC2155
        with:
          scandir: .
          # macos/.macos is a tracked, executable `#!/usr/bin/env bash` script
          # (the one-shot `defaults write` pass for a fresh machine) that the
          # action's own discovery cannot see: it has no .sh extension, and the
          # shebang pass only looks at extensionless files — `.macos` reads as
          # "extension .macos". additional_files entries become `-name '*.<entry>'`,
          # so `macos` is the spelling that matches. Without it an unbalanced
          # quote or a missing `fi` in that script ships green and only detonates
          # during a fresh install — the one moment nothing else works either.
          # The file is clean at every severity today, so this adds coverage,
          # not red.
          additional_files: macos
          severity: warning
          ignore_paths: >-
            tmux/.config/tmux/.tmux/plugins
            site
            .dos
            .pi
            nvim
            zsh
          check_together: "yes"
          # zsh/ is excluded because ShellCheck does not support zsh at all — not
          # as a severity, as a dialect. .zshrc uses an anonymous function with
          # glob qualifiers (`if () { setopt localoptions extendedglob; ... }`)
          # which is valid zsh and unparseable as bash, so it emitted SC1072/
          # SC1073 *errors* that no amount of correct zsh could ever clear.
          # .zprofile drew SC2148 for having no shebang, which is right for a
          # sourced zsh startup file. Linting them was never going to be
          # meaningful; excluding them is the fix, not a suppression.

  lua-lint:
    name: Lua Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Run luacheck on Neovim config
        run: |
          luacheck nvim/.config/nvim/ \
            --no-unused-args \
            --no-max-line-length \
            --globals vim \
            --ignore 212 \
            || true  # Advisory, don't fail CI yet

  toml-validate:
    name: TOML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
            | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo

      - name: Validate TOML files
        run: |
          find . -name '*.toml' \
            ! -path './.git/*' \
            ! -path './site/*' \
            ! -path './tmux/.config/tmux/.tmux/plugins/*' \
            -exec taplo check {} +

      # The AeroSpace config never reaches the step above: the rendered
      # aerospace.toml is gitignored (so it is absent from a fresh checkout) and
      # the template — 618 lines, the largest TOML here and the declared source
      # of truth — is named *.toml.template. Adding that suffix to the find does
      # NOT work: taplo's own include glob is `**/*.toml`, so a path that does
      # not end in .toml is dropped ("excluded=1 files=[]") and taplo still exits
      # 0 — coverage that looks real and checks nothing. Copy to a .toml name
      # and check that. The @DOTFILES_MONITOR_*@ placeholders sit inside quoted
      # strings and parse fine unrendered.
      - name: Validate AeroSpace TOML template
        run: |
          cp aerospace/templates/aerospace.toml.template "${RUNNER_TEMP}/aerospace-check.toml"
          taplo check "${RUNNER_TEMP}/aerospace-check.toml"

  stow-dry-run:
    name: Stow Dry Run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      # Packages come from stow-packages.txt, shared with install.sh and
      # setup.sh. This step used to carry its own list of 15 of the 22 packages,
      # so espanso, fastfetch, kitty, mise, ubersicht, wallpapers and wezterm
      # were never dry-run-verified and a conflict in any of them shipped green.
      - name: Verify stow packages (dry run)
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakehome/.config
          # `|| true` is load-bearing under set -euo pipefail: an empty manifest
          # filters to zero lines and grep exits 1, which would abort the step
          # with no diagnostic. Fail on the explicit check instead.
          packages="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' stow-packages.txt | grep -v '^$' || true)"
          if [ -z "$packages" ]; then
            echo "stow-packages.txt lists no packages"
            exit 1
          fi
          echo "manifest lists $(echo "$packages" | wc -l | tr -d ' ') packages"
          failed=0
          # here-string, not a pipe: a `while read` on the right of a pipe runs in
          # a subshell and the `failed` assignment would never reach this scope,
          # turning every failure into a silent pass.
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if [ ! -d "$pkg" ]; then
              echo "✗ $pkg — listed in stow-packages.txt but no such directory"
              failed=1
              continue
            fi
            if stow -n -t /tmp/fakehome "$pkg" 2>&1; then
              echo "✓ $pkg"
            else
              echo "✗ $pkg"
              failed=1
            fi
          done <<< "$packages"
          exit "$failed"

  stow-linux-dry-run:
    name: Stow Dry Run (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stow

      # The Linux manifest gets its own job, on a real Linux runner, for the
      # reason the Linux installer is a separate script at all: an unexercised
      # path rots. stow-packages.linux.txt names a SUBSET of the macOS manifest,
      # so this also catches a package renamed or removed on the macOS side
      # without the Linux list being updated.
      - name: Verify Linux stow packages (dry run)
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakehome/.config
          # `|| true`: an empty manifest filters to zero lines and grep exits 1,
          # which would abort the step with no diagnostic.
          packages="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' stow-packages.linux.txt | grep -v '^$' || true)"
          if [ -z "$packages" ]; then
            echo "stow-packages.linux.txt lists no packages"
            exit 1
          fi
          echo "manifest lists $(echo "$packages" | wc -l | tr -d ' ') packages"
          failed=0
          # here-string, not a pipe: `while read` on the right of a pipe runs in a
          # subshell and the `failed` assignment would never reach this scope.
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if [ ! -d "$pkg" ]; then
              echo "✗ $pkg — listed in stow-packages.linux.txt but no such directory"
              failed=1
              continue
            fi
            # Must also be a real macOS package: the Linux list is a subset, never
            # a source of packages the macOS manifest does not know about.
            if ! sed -e 's/#.*//' -e 's/[[:space:]]//g' stow-packages.txt | grep -qx "$pkg"; then
              echo "✗ $pkg — in the Linux manifest but not in stow-packages.txt"
              failed=1
              continue
            fi
            if stow -n -t /tmp/fakehome "$pkg" 2>&1; then
              echo "✓ $pkg"
            else
              echo "✗ $pkg"
              failed=1
            fi
          done <<< "$packages"
          exit "$failed"

  convention-check:
    name: Convention Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md declares path agnosticism "enforced" — nothing enforced it.
      # ShellCheck cannot model the rule and is told to skip zsh/ entirely, which
      # is exactly where the one live violation sat: zsh/.zshrc hardcoded
      # /Users/lgertel in bun's completion guard, so on any other machine the
      # `[ -s ... ]` test silently failed and completions never loaded — while
      # README.md claimed those paths had already been replaced with $HOME. A
      # grep is the whole enforcement this rule ever needed.
      #
      # Exempt: *.md (CLAUDE.md and README.md quote the rule verbatim); the
      # LaunchAgent templates, where the __USER__ placeholder is rendered by
      # setup.sh --configure; and this workflow itself, whose comments and grep
      # pattern necessarily contain the very string being hunted — without that
      # exclusion the job fails on its own source, which is how a new gate ends
      # up disabled on day one.
      - name: No hardcoded absolute home paths
        run: |
          if git grep -n -I -e '/Users/' \
               -- ':!*.md' \
                  ':!launchagents/Library/LaunchAgents/*.plist.template' \
                  ':!.github/workflows/lint.yml'; then
            echo
            echo "Hardcoded /Users/ path above. Use \$HOME in shell, ~ in config comments."
            echo "Machine-specific values belong in ~/.config/dotfiles/personal.env."
            exit 1
          fi
