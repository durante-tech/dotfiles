        - generic [ref=e228]:
          - generic [ref=e230]: The Dell U2718Q is a very good 4k IPS monitor. Like most Dell monitors, it has outstanding ergonomics, so it's easy to adjust it to an ideal viewing position. It has decent accuracy out of the box and wide viewing angles, great for media creation or for sharing the screen with someone else. Areas of similar color look amazing, with no noticeable banding in gradients. Unfortunately, although it supports HDR, this doesn't add very much, as it can't display a wide color gamut and it has a low contrast ratio, so blacks look gray in a dark room.
