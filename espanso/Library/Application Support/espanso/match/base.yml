# espanso base match file — minimal starter snippets
# Add more triggers here. Reference: https://espanso.org/docs/matches/basics/

matches:
  # ISO date stamp — :dt -> 2026-04-30
  - trigger: ":dt"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%d"

  # ISO timestamp — :ts -> 2026-04-30T14:32:01
  - trigger: ":ts"
    replace: "{{ts}}"
    vars:
      - name: ts
        type: date
        params:
          format: "%Y-%m-%dT%H:%M:%S"

  # Email signature — :sig. Name/email come from ~/.config/dotfiles/personal.env
  # (DOTFILES_SIG_NAME / DOTFILES_SIG_EMAIL), falling back to git config.
  # Absolute git path, plus macos_override_path: false on both vars. espanso
  # 2.4.0 defaults that param to TRUE and re-runs the override on every single
  # invocation (espanso-render/src/extension/shell.rs, no caching), which spawns
  # `zsh --login -c 'source ~/.zshrc; echo $PATH'` just to rebuild $PATH —
  # measured at 0.23s a piece here, so :sig was paying ~0.5s to boot mise, atuin
  # and the Fabric alias cache twice for a PATH it never reads. Every binary
  # below is already absolute.
  - trigger: ":sig"
    replace: |
      {{sig_name}}
      {{sig_email}}
    vars:
      - name: sig_name
        type: shell
        params:
          macos_override_path: false
          cmd: '. "$HOME/.config/dotfiles/personal.env" 2>/dev/null; printf "%s" "${DOTFILES_SIG_NAME:-$(/usr/bin/git config --get user.name 2>/dev/null)}"'
      - name: sig_email
        type: shell
        params:
          macos_override_path: false
          cmd: '. "$HOME/.config/dotfiles/personal.env" 2>/dev/null; printf "%s" "${DOTFILES_SIG_EMAIL:-$(/usr/bin/git config --get user.email 2>/dev/null)}"'
