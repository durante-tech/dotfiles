# Kitty Terminal Configuration
# Mirrored from Ghostty config
# Reload config: ctrl+shift+f5 (or cmd+b>r via custom mapping below)

# =============================================================================
# THEME
# =============================================================================

include rosepine.conf

# =============================================================================
# BACKGROUND & TRANSPARENCY
# =============================================================================

background #000000
background_opacity 0.75
background_blur 23

# =============================================================================
# FONT
# =============================================================================

font_family JetBrainsMono Nerd Font
font_size 14.0

# Thicken text — mirrors Ghostty's `font-thicken = true` (ghostty config:11).
# `platform` is kitty's shipped default and on macOS means gamma 1.7 / contrast
# 30, the thick native curve. Do NOT write `1.0 0`: kitty's docs give that pair
# only as the neutral STARTING POINT of a tuning session, and it lowers both
# numbers from the macOS defaults, so text renders THINNER than stock — the
# opposite of the intent. On this dark Rose Pine theme the second number
# (contrast) is what carries the weight, and `1.0 0` zeroes it.
text_composition_strategy platform

# Adjust character spacing — DISABLED, which is what "like Ghostty" now means.
# ghostty/.config/ghostty/config:14 keeps `# adjust-cell-width = -5%` commented
# out because narrowed cells broke Claude Code's TUI column math (text wrapped at
# the wrong positions); docs/getting-started/daily-workflow.md makes it checklist
# item #2, "Text wrapping wrong? -> Remove any adjust-cell-width". Commit 9a3b03f
# applied that fix to Ghostty and zsh but never to kitty, so the old comment
# claimed a parity that had not existed since. kitty's own docs also warn:
# "Decreasing the cell size might cause rendering artifacts, so use with care."
# modify_font cell_width 95%

# Enable programming ligatures
disable_ligatures never

# =============================================================================
# CURSOR
# =============================================================================

cursor_shape block
cursor_blink_interval 0
cursor #ffff00
cursor_text_color background

# =============================================================================
# WINDOW & APPEARANCE
# =============================================================================

# Hidden titlebar (like Ghostty macos-titlebar-style = hidden)
hide_window_decorations titlebar-only

window_padding_width 10

# No confirm on close
confirm_os_window_close 0

# =============================================================================
# MACOS SPECIFIC
# =============================================================================

# Left Option = Alt (tmux alt+1..5 layouts, FZF Alt+C, vim Meta).
# Right Option = macOS compose key for pt-BR accents (Right-Opt+C -> ç, etc.).
# NOTE: this board has no physical right Option — right Command is remapped to
# right_option in Karabiner (simple_modifications) to serve as the accent key.
macos_option_as_alt left

# Hide mouse while typing — mirrors Ghostty's `mouse-hide-while-typing = true`.
# A NEGATIVE value hides the pointer immediately when you type. ZERO means
# "never hide" and is ALREADY kitty's macOS default, so the previous `0` was a
# no-op that documented behaviour that was not happening.
# Upstream leaves hiding off on macOS by choice ("getting it to work robustly
# with ... Cocoa is too much effort"), so if the pointer flickers or sticks,
# set this back to 0 and drop the parity with Ghostty.
mouse_hide_wait -1.0

# Hide the window title in both places (companion to hide_window_decorations
# titlebar-only above). NOTE: this is NOT a shadow setting. kitty has no macOS
# window-shadow option at all — every macos_* option was enumerated and none
# mentions shadows — so Ghostty's `macos-window-shadow = false` (ghostty
# config:7) has no kitty equivalent. Don't go looking for one.
macos_show_window_title_in none

# Shell integration (match Ghostty: no-cursor)
shell_integration no-cursor

# =============================================================================
# MISC
# =============================================================================

# Disable audio bell
enable_audio_bell no

# Remote control via socket only (required for PAI tab-setter hooks)
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# =============================================================================
# KEYBINDINGS — Cmd+B prefix mode (coexists with tmux's Ctrl+B)
# =============================================================================

# Clear default shortcuts that conflict
map cmd+t no_op
map cmd+n no_op
map cmd+w no_op

# Shift+Enter — DISABLED, mirroring Ghostty and zsh.
# `send_text` consumes the key at the terminal layer and emits ESC+CR, so the
# application never sees a Shift+Enter event and kitty's own keyboard protocol
# never gets to encode it as CSI 13;2u — which is exactly how Claude Code tells
# Shift+Enter apart from Enter. Result: multi-line input breaks.
# Commit 9a3b03f disabled the same thing in ghostty config:94 and in the zsh
# bindkeys at zsh/.zshrc:118-119; kitty was the last place it survived.
# map shift+enter send_text all \x1b\x0d

# Show kitty's environment variables.
# NOTE: this is NOT Ghostty's inspector (ghostty config:54
# `super+i=inspector:toggle`) — kitty ships no inspector action. Its nearest
# debugging view is `debug_config` (dumps the effective config; stock shortcuts
# ctrl+shift+f6, or opt+cmd+, on macOS). Swap the action below if that is what
# you actually reach for.
map cmd+i show_kitty_env_vars

# --- Prefix mode: Cmd+B enters "tmux" mode ---
# Cmd is macOS-only and never reaches the running program, so tmux's
# Ctrl+B prefix passes through untouched when running tmux inside kitty.
map --new-mode tmux --on-unknown end cmd+b

# Escape / Ctrl+C exits prefix mode
map --mode tmux escape pop_keyboard_mode
map --mode tmux ctrl+c pop_keyboard_mode

# ── Core ─────────────────────────────────────────────────────
# Reload config (prefix + r)
map --mode tmux r combine : load_config_file : pop_keyboard_mode

# Close pane (prefix + x)
map --mode tmux x combine : close_window : pop_keyboard_mode

# New tab (prefix + c) — equivalent to tmux new-window
map --mode tmux c combine : new_tab_with_cwd : pop_keyboard_mode

# New OS window (prefix + n) — closest to tmux new-session
map --mode tmux n combine : new_os_window : pop_keyboard_mode

# Detach — no real equivalent, but close the OS window
map --mode tmux shift+d combine : close_os_window : pop_keyboard_mode

# ── Tab navigation (prefix + 1-9) ───────────────────────────
map --mode tmux 1 combine : goto_tab 1 : pop_keyboard_mode
map --mode tmux 2 combine : goto_tab 2 : pop_keyboard_mode
map --mode tmux 3 combine : goto_tab 3 : pop_keyboard_mode
map --mode tmux 4 combine : goto_tab 4 : pop_keyboard_mode
map --mode tmux 5 combine : goto_tab 5 : pop_keyboard_mode
map --mode tmux 6 combine : goto_tab 6 : pop_keyboard_mode
map --mode tmux 7 combine : goto_tab 7 : pop_keyboard_mode
map --mode tmux 8 combine : goto_tab 8 : pop_keyboard_mode
map --mode tmux 9 combine : goto_tab 9 : pop_keyboard_mode

# ── Splits ───────────────────────────────────────────────────
# prefix + | — vertical split (like tmux split -h)
map --mode tmux | combine : launch --location=vsplit --cwd=current : pop_keyboard_mode

# prefix + - — horizontal split (like tmux split -v)
map --mode tmux - combine : launch --location=hsplit --cwd=current : pop_keyboard_mode

# ── Pane navigation (prefix + h/j/k/l) ──────────────────────
map --mode tmux h combine : neighboring_window left : pop_keyboard_mode
map --mode tmux j combine : neighboring_window bottom : pop_keyboard_mode
map --mode tmux k combine : neighboring_window top : pop_keyboard_mode
map --mode tmux l combine : neighboring_window right : pop_keyboard_mode

# ── Pane resize (prefix + H/J/K/L) ──────────────────────────
map --mode tmux shift+j combine : resize_window shorter 3 : pop_keyboard_mode
map --mode tmux shift+k combine : resize_window taller 3 : pop_keyboard_mode
map --mode tmux shift+l combine : resize_window wider 3 : pop_keyboard_mode
map --mode tmux shift+h combine : resize_window narrower 3 : pop_keyboard_mode

# ── Zoom / maximize pane (prefix + m) ───────────────────────
map --mode tmux m combine : toggle_layout stack : pop_keyboard_mode

# ── Equalize layout (prefix + e) ────────────────────────────
map --mode tmux e combine : goto_layout grid : pop_keyboard_mode

# ── Copy mode (prefix + v) — scrollback in pager ────────────
map --mode tmux v combine : show_scrollback : pop_keyboard_mode

# ── Clear pane (prefix + Ctrl+K) ────────────────────────────
# `reset` dispatches to clear_screen(reset=True, scrollback=True) — it resets the
# terminal AND wipes scrollback, matching tmux.conf:52 `send-keys -R \; clear-history`
# and CLAUDE.md's "Clear pane (reset terminal + wipe scrollback)". The previous
# `scrollback` variant only calls screen.clear_scrollback(), leaving every visible
# line on screen, so pressing Cmd+B Ctrl+K looked like it did nothing at all.
map --mode tmux ctrl+k combine : clear_terminal reset active : pop_keyboard_mode

# ── Floating overlays ───────────────────────────────────────
# prefix + Ctrl+Y — yazi file manager
map --mode tmux ctrl+y combine : launch --type=overlay --cwd=current yazi : pop_keyboard_mode

# prefix + t — quick floating terminal
map --mode tmux t combine : launch --type=overlay --cwd=current : pop_keyboard_mode

# prefix + Ctrl+G — lazygit
map --mode tmux ctrl+g combine : launch --type=overlay --cwd=current lazygit : pop_keyboard_mode

# prefix + Shift+M — rmpc music player
map --mode tmux shift+m combine : launch --type=overlay rmpc : pop_keyboard_mode

# prefix + w — w3m browser
map --mode tmux w combine : launch --type=overlay w3m https://duckduckgo.com : pop_keyboard_mode

# ── Sessionizer (prefix + f) — fzf project picker ───────────
map --mode tmux f combine : launch --type=overlay --cwd=current kitty-sessionizer : pop_keyboard_mode

# ── Config menu (prefix + d) — fzf config picker ────────────
map --mode tmux d combine : launch --type=overlay kitty-config-menu : pop_keyboard_mode

# ── Layout presets (prefix + Alt+1..5) ───────────────────────
map --mode tmux alt+1 combine : goto_layout splits : pop_keyboard_mode
map --mode tmux alt+2 combine : goto_layout horizontal : pop_keyboard_mode
map --mode tmux alt+3 combine : goto_layout grid : pop_keyboard_mode
map --mode tmux alt+4 combine : goto_layout vertical : pop_keyboard_mode
map --mode tmux alt+5 combine : goto_layout stack : pop_keyboard_mode

# Enable layouts needed for splits and zoom
enabled_layouts splits,grid,stack,horizontal,vertical

# =============================================================================
# SCROLLBACK PAGER (nvim for vim-style copy mode)
# =============================================================================

scrollback_pager nvim -c "set nonumber norelativenumber signcolumn=no showtabline=0 foldcolumn=0 laststatus=0" -c "autocmd TermOpen * normal G" -c "silent! %s/\\e\\[[0-9;]*m//g" -c "map q :qa!<CR>" -

# =============================================================================
# SUB-CELL PADDING DISTRIBUTION
# =============================================================================

# Where the leftover pixels go when the window is not an exact multiple of the
# cell size. `center` is kitty's shipped default and is the direct analogue of
# Ghostty's `window-padding-balance = true` (ghostty config:37). The previous
# `top-left` dumped every leftover pixel at the bottom and right edges — the same
# "Dumps all leftover pixel space to bottom, creating blank gaps" defect the repo
# fixed in Ghostty, and checklist item #1 in
# docs/getting-started/daily-workflow.md ("Blank gap at bottom?").
# Nothing here relates to the graphics protocol; the old "IMAGE SUPPORT" heading
# was simply wrong — kitty needs no config to enable its image protocol.
placement_strategy center

# Personal readability is last so it can override the base values above.
# personalize.sh creates this owned file even with no overrides. If absent,
# Kitty reports that it is ignoring the missing include and keeps the base config.
include ~/.config/dotfiles/readability/kitty.conf
