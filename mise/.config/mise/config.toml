# Global mise config — replaces fnm + pyenv defaults
# Per-project versions are resolved from .mise.toml | .tool-versions | .nvmrc | .python-version
# (mise reads all four formats natively, so existing project files keep working)

[tools]
# Node 26 is the Active LTS line: LTS since 2026-10-28, maintenance from
# 2027-10-20, end of life 2029-04-30. Node 24, pinned here before, moved to
# maintenance on 2026-10-20. Dates from nodejs/Release schedule.json, read
# 2026-11-10. Odd-numbered lines (25, 27) never become LTS: skip them.
# Renovate raises this within the 26 line; a new major waits for approval.
node   = "26"
# 3.12 left its bugfix phase on 2025-04-02, so every 3.12.x published since is
# a SECURITY release -- drifting on the patch level is the whole cost here. The
# line itself is supported to 2028-10-31 (endoflife.date), so stay on 3.12 and
# keep the patch current. Was "3.12.12", inherited from the old pyenv global.
python = "3.12.14"

[settings]
# This is the "command not found" handler, NOT an on-cd hook. Upstream
# settings.toml: "Set to false to disable the 'command not found' handler to
# autoinstall missing tool versions" -- it fires when you invoke a binary mise
# owns, never on directory entry. Entering a project with an uninstalled pin
# only WARNS ("... is specified in mise.toml, but not installed"); `mise
# install` is what provisions it. Kept explicit at its default so a future
# upstream flip to false is visible here rather than silent.
not_found_auto_install = true
# Feature-stability gate, unrelated to how many tools are installed: "Enable
# experimental mise features which are incomplete or unstable -- breaking
# changes may occur". Kept explicit at its default so this machine cannot be
# opted into unstable behaviour by an upstream default change.
experimental = false
# Read .nvmrc / .python-version (mise calls these "idiomatic" files; opt-in by design)
idiomatic_version_file_enable_tools = ["node", "python"]
