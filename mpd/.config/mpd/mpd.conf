# MPD Configuration File
# See: https://www.musicpd.org/doc/html/user.html

# Music directory
music_directory    "~/Music"

# Playlist directory
playlist_directory "~/.config/mpd/playlists"

# Runtime state lives OUTSIDE the repo (~/.config/mpd is a stow symlink
# into git; DB/log/pid used to grow inside the working tree)
# Database file
db_file            "~/.local/state/mpd/database"

# State file (saves current playlist state)
state_file         "~/.local/state/mpd/state"

# Sticker database (for song ratings, play counts, etc.)
sticker_file       "~/.local/state/mpd/sticker.sql"

# Log file
log_file           "~/.local/state/mpd/mpd.log"

# PID file
pid_file           "~/.local/state/mpd/pid"

# Port for MPD to listen on
bind_to_address    "127.0.0.1"
port               "6600"

# zeroconf_enabled defaults to "yes" (mpd.conf(5); DEFAULT_ZEROCONF_ENABLED 1 in
# src/zeroconf/Glue.cxx) and this build has Bonjour linked in (`nm -u mpd` shows
# _DNSServiceRegister). Main.cxx gates publication on the listening port alone,
# never on bind_to_address, and Bonjour.cxx registers on interface index 0 = all
# interfaces — so a loopback-only daemon still multicast "Music Player @ <host>"
# / _mpd._tcp on every joined network, advertising a server nothing off-box can
# reach. Off by choice, to match the loopback bind above.
zeroconf_enabled   "no"

# Audio output configuration
audio_output {
    type           "osx"
    name           "CoreAudio"
    mixer_type     "software"
}

# Optional: Enable visualizer output for clients that support it
audio_output {
    type           "fifo"
    name           "Visualizer"
    path           "/tmp/mpd.fifo"
    format         "44100:16:2"
}

# Restore paused state on startup
restore_paused     "yes"

# auto_update is inotify-only and inotify is a Linux kernel API: mpd.conf(5) and
# Homebrew's own /opt/homebrew/etc/mpd/mpd.conf.default both say "(Linux only)",
# and this build took the #else branch — `strings /opt/homebrew/bin/mpd` contains
# exactly one inotify message: "inotify: auto_update was disabled. enable during
# compilation phase". Leaving it on watched nothing and logged that warning on
# every start. Rescan from rmpc instead: `u` = Update, `U` = Rescan.
#auto_update        "yes"

# Follow symlinks
follow_outside_symlinks  "yes"
follow_inside_symlinks   "yes"
