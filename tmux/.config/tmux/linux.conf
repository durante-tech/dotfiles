# tmux — Linux overrides. Sourced from tmux.conf only when uname is not Darwin.
#
# Everything in tmux.conf is portable EXCEPT the clipboard: six bindings pipe to
# pbcopy/pbpaste, which do not exist here. tmux does not report a failed
# copy-pipe, so on Linux the yank keys silently did nothing — the selection was
# cancelled and the clipboard never changed.
#
# Re-bound rather than made conditional in place, so the macOS path keeps the
# exact bindings it has always had and carries zero regression risk from this
# file existing.
#
# Copy tool is resolved once, at config load, in this order:
#   wl-copy   Wayland (wl-clipboard)
#   xclip     X11 — the one already in this repo's Brewfile
#   xsel      X11 fallback
# If none is installed the bindings still work as selections; only the system
# clipboard handoff is lost.

# Resolve the tools into user options so the bindings below stay readable.
run-shell 'tmux set -g @clip_copy  "$(command -v wl-copy >/dev/null && echo wl-copy || { command -v xclip >/dev/null && echo "xclip -selection clipboard -in" || echo "xsel --clipboard --input"; })"'
run-shell 'tmux set -g @clip_paste "$(command -v wl-paste >/dev/null && echo wl-paste || { command -v xclip >/dev/null && echo "xclip -selection clipboard -out" || echo "xsel --clipboard --output"; })"'

# Copy-mode yanks (tmux.conf lines 60 and 64 on macOS).
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "#{@clip_copy}"
bind-key -T copy-mode-vi 'Y' send -X copy-pipe-end-of-line-and-cancel "#{@clip_copy}"

# Mouse selection (tmux.conf lines 111, 114, 117).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clip_copy}"
bind-key -n DoubleClick1Pane select-pane \; copy-mode \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "#{@clip_copy}"
bind-key -n TripleClick1Pane select-pane \; copy-mode \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "#{@clip_copy}"

# Middle-click paste (tmux.conf line 120).
bind-key -n MouseDown2Pane run "tmux set-buffer \"$(#{@clip_paste})\"; tmux paste-buffer"
