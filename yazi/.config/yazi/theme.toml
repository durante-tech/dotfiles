# Catppuccin Mocha theme for Yazi
# https://github.com/catppuccin/yazi
# Migrated 2026-07-15 to the yazi 26.x theme schema:
# [manager]->[mgr], tab_*->[tabs], mode_*->[mode], separator_*->sep_left/right,
# permissions_*->perm_*, [select]->[pick], help.exec->run, name->url globs.
# Second pass for yazi 26.8.15: mgr.hovered/preview_hovered -> [indicator]
# current/preview (#3419), and help.on/run/desc/footer -> chord/action (#4074).

[mgr]
cwd = { fg = "#89b4fa" }

# Find
find_keyword = { fg = "#f9e2af", italic = true }
find_position = { fg = "#f38ba8", bg = "reset", italic = true }

# Marker
marker_selected = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_copied = { fg = "#f9e2af", bg = "#f9e2af" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }

# Border
border_symbol = "│"
border_style = { fg = "#7f849c" }

# Highlighting
syntect_theme = "~/.config/bat/themes/Catppuccin-mocha.tmTheme"

# Hovered row + hovered preview. v26.5.6 reclassified `hovered` and
# `preview_hovered` out of [mgr] into [indicator] as `current`/`preview`
# (#3419); left under [mgr] they were unknown keys, so the most visible element
# in the file list fell back to the preset `{ reversed = true }` instead of
# this Catppuccin blue.
[indicator]
current = { fg = "#1e1e2e", bg = "#89b4fa" }
preview = { underline = true }

[tabs]
active = { fg = "#1e1e2e", bg = "#cdd6f4" }
inactive = { fg = "#cdd6f4", bg = "#45475a" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
unset_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#45475a" }
progress_error = { fg = "#f38ba8", bg = "#45475a" }

# Permissions
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }
perm_sep = { fg = "#7f849c" }

[input]
border = { fg = "#89b4fa" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#89b4fa" }
active = { fg = "#f5c2e7" }
inactive = {}

[tasks]
border = { fg = "#89b4fa" }
title = {}
hovered = { underline = true }

[which]
mask = { bg = "#313244" }
cand = { fg = "#94e2d5" }
rest = { fg = "#9399b2" }
desc = { fg = "#f5c2e7" }
separator = "  "
separator_style = { fg = "#585b70" }

# v26.8.15 turned the help menu into a command palette (#4074) and rewrote its
# theme keys: `on` -> `chord`, `run` and `desc` merged into one `action`, and
# `footer` removed with no replacement. As unknown keys the old four were
# dropped, so only `hovered` ever applied. `border` added to match every other
# component in this file.
[help]
border = { fg = "#89b4fa" }
chord = { fg = "#f5c2e7" }
action = { fg = "#94e2d5" }
hovered = { bg = "#585b70", bold = true }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#94e2d5" },
  # Videos
  { mime = "video/*", fg = "#f9e2af" },
  # Audio
  { mime = "audio/*", fg = "#f9e2af" },
  # Archives
  { mime = "application/zip", fg = "#f5c2e7" },
  { mime = "application/gzip", fg = "#f5c2e7" },
  { mime = "application/x-tar", fg = "#f5c2e7" },
  { mime = "application/x-bzip2", fg = "#f5c2e7" },
  { mime = "application/x-7z-compressed", fg = "#f5c2e7" },
  { mime = "application/x-rar", fg = "#f5c2e7" },
  # Documents
  { mime = "application/pdf", fg = "#f38ba8" },
  { mime = "application/doc", fg = "#89b4fa" },
  { mime = "application/msword", fg = "#89b4fa" },
  # Fallback
  { url = "*", fg = "#cdd6f4" },
  { url = "*/", fg = "#89b4fa" },
]
