# Yazi configuration
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
cache_dir = ""
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# yazi substitutes ONLY its own `%` parameters: `%s` = every selected path,
# `%s1` = just the first. `$@`/`$n` were deprecated in v25.12.29 (#3232) and no
# longer expand — yazi runs `sh -c '<run>'` with NO positional arguments, so
# `nvim "$@"` opened an empty nvim dashboard instead of the hovered file and
# `open "$@"` handed macOS `open` zero arguments (usage error). `%s` is
# shell-quoted by yazi, so paths with spaces are safe unquoted.
edit = [
  { run = 'nvim %s', block = true, desc = "Edit with Neovim" },
]
open = [
  { run = 'open %s', desc = "Open" },
]
reveal = [
  # `open -R` reveals a single target, hence %s1 — same as the 26.x preset.
  { run = 'open -R %s1', desc = "Reveal in Finder" },
]

[open]
# `prepend_rules`, not `rules`: a plain `rules` array REPLACES the preset
# wholesale (verified — with a plain array, opening a .json matched no rule at
# all and did nothing). Prepending keeps the preset rules underneath, which is
# where archives -> `extract`, audio/video -> `play`, empty files -> `edit`,
# and the `*` fallback live. Only the typescript rule is genuinely ours; the
# rest mirror the preset and are kept so ordering stays explicit.
prepend_rules = [
  # Folder
  { url = "*/", use = ["edit", "open", "reveal"] },

  # Text files
  { mime = "text/*", use = ["edit", "reveal"] },
  { mime = "application/json", use = ["edit", "reveal"] },
  { mime = "application/javascript", use = ["edit", "reveal"] },
  { mime = "application/typescript", use = ["edit", "reveal"] },
]

[tasks]
# `micro_workers`/`macro_workers` were REMOVED in v26.5.6 (#3661) in favour of
# per-kind worker counts — as unknown keys the old pair was discarded, so the
# intended extra concurrency never applied. Preset defaults are 3/5/5/2/5;
# these are raised deliberately (10/25 does not map 1:1 onto five knobs).
file_workers = 10     # copy / move / delete parallelism
plugin_workers = 10
fetch_workers = 10
preload_workers = 5   # preview preloading
process_workers = 10
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]

# There is deliberately NO [plugin] section. Plain `preloaders`/`previewers`
# arrays REPLACE the preset wholesale (only `prepend_*`/`append_*` merge), so
# the old block pinned previews to a 2024-era handler set and — worse — kept a
# `{ run = "mime" }` preloader that no longer exists: MIME detection moved to
# preset `fetchers` in v25.12.29 (#3222). That dead rule queued one
# never-finishing "Run preloader 'mime'" task per file, so the status bar sat
# at "N left" and EVERY quit hit the "There are unfinished tasks" prompt.
# Everything the old list covered (folder/code/json/image/video/pdf/archive/
# file) is in the 26.8.15 preset, which also adds svg, magick for avif/heic/
# jxl, fonts, empty files and many more archive formats. To add anything
# yazi does not ship, use `prepend_previewers`/`append_preloaders` — never a
# bare array.

[input]
# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create — array since yazi 25.x: [file prompt, directory prompt]
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# Confirmation dialogs. trash/delete/overwrite/quit moved OUT of [input] into
# their own [confirm] section in v25.12.29 — under [input] they were unknown
# keys and were dropped (verified: quitting still rendered the upstream
# "Quit? / There are unfinished tasks" wording, not this file's). 26.8.15 draws
# its own [Y]es/(N)o buttons, so the "(y/N)" suffix is gone, and it pluralises
# via {s}. The boxes also need real height — the old 3-row offset could not fit
# the file list plus the buttons.
[confirm]
trash_title = "Move {n} selected file{s} to trash?"
trash_origin = "top-center"
trash_offset = [0, 2, 70, 20]

delete_title = "Delete {n} selected file{s} permanently?"
delete_origin = "top-center"
delete_offset = [0, 2, 70, 20]

overwrite_title = "Overwrite an existing file?"
overwrite_origin = "top-center"
overwrite_offset = [0, 2, 50, 15]

quit_title = "{n} task(s) running, sure to quit?"
quit_origin = "top-center"
quit_offset = [0, 2, 50, 15]

# Renamed [select] -> [pick] in yazi 26.x. theme.toml was migrated on
# 2026-07-15 and this file was not, so the whole section was an unknown key and
# the "Open with:" picker silently used preset geometry.
[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]
